[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evalloop"
version = "0.2.0"
description = "Unit tests and a CI gate for LLM agents: reliability (pass^k), hallucination, prompt injection, loops, cost and latency."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["llm", "agents", "evals", "testing", "ci"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
evalloop = "evalloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
