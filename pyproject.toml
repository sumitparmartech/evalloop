[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evalloop-agents"
version = "0.7.0"
description = "Unit tests and a CI gate for LLM agents: reliability (pass^k), multi-turn conversations, prompt injection, hallucination, loops, cost and latency. Works with OpenAI Agents SDK and LangGraph."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["llm", "agents", "evals", "testing", "ci", "pass-k", "reliability", "llm-as-judge", "pytest", "langgraph", "openai-agents", "prompt-injection", "red-teaming"]
authors = [{ name = "Sumit Parmar" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://sumitparmartech.github.io/evalloop/"
Source = "https://github.com/sumitparmartech/evalloop"
Changelog = "https://github.com/sumitparmartech/evalloop/blob/main/CHANGELOG.md"
Issues = "https://github.com/sumitparmartech/evalloop/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
agents = ["openai-agents>=0.2"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]

[project.scripts]
evalloop = "evalloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalloop = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
