name: Bug report
description: Something in evalloop does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest code that shows it
      description: Please remove API keys and private data.
      render: python
  - type: input
    id: version
    attributes:
      label: evalloop version and Python version
      placeholder: "evalloop 0.6.0, Python 3.12"
  - type: input
    id: framework
    attributes:
      label: Model provider or framework (if any)
      placeholder: "Groq, OpenAI Agents SDK, LangGraph..."
