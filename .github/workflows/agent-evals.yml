name: agent-evals
on: [pull_request]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Run evals and gate on regressions
        working-directory: examples
        run: |
          python -m evalloop.cli run suite:cases \
            --agent support_agent:agent_v2 \
            --name support-agent --label pr --trials 5 --seed 2 \
            --baseline ../docs/run_v2.json \
            --fail-on-regression --fail-under 0.95 \
            --html ../report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evalloop-report, path: report.html }
