name: agent-evals
on: [pull_request]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Run evals and gate on regressions
        working-directory: examples
        run: |
          python -m evalloop.cli run suite:cases \
            --agent support_agent:agent_v2 \
            --name support-agent --label pr --trials 5 --seed 2 --workers 4 \
            --baseline ../docs/run_v2.json \
            --fail-on-regression --fail-under 0.95 \
            --html ../report.html --junit ../junit.xml \
            --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: evalloop-report, path: "report.html\njunit.xml" }
